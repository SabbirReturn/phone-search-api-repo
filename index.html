<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/index.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#edeef0] hover:bg-[#c7d4e9]">
    <header>
        <div class="flex justify-between items-center py-3 px-3 md:px-5 lg:px-48">
            <h1>Hot Gadget</h1>
            <button id="primary-btn" class="btn btn-active btn-primary">Sign In</button>
        </div>
        <div class="text-center mx-auto max-w-xl mt-4">
            <p class="leading-relaxed text-gray-600">Discover the latest smartphones from top brands, all in one place. We offer the best deals, genuine products, and fast, reliable service.Upgrade your mobile experience with quality devices you can trust.</p>
        </div>
        <div class="text-center mx-auto max-w-xl mt-7">
            <button id="primary-btn" class="btn btn-active btn-primary">Buy Now</button>
        </div>
    </header>
    <main class="container mx-auto mt-5">
        
        <!-- Tamp Image -->
        <section class=" flex justify-center">
            <img class="" src="image/Mobile-removebg-preview.png" alt="">
        </section>

        <!-- Search section -->

        <section class="text-center my-5 mx-auto">
            <p class="py-5">Search your Phone</p>
            <label class="input">
                <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <g
                    stroke-linejoin="round"
                    stroke-linecap="round"
                    stroke-width="2.5"
                    fill="none"
                    stroke="currentColor"
                    >
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.3-4.3"></path>
                    </g>
                </svg>
                
                <input id="search-container" type="search" required placeholder="Drop your Phone Name" />
            </label>
            <button onclick="searchBtn()" class="btn">Search</button>
        </section>


        <!-- loading section -->
        
        <section>
            <div class="text-center">
                <span id="loadingDot" class="loading loading-dots loading-lg hidden"></span>
            </div>
        </section>
        <section class="mx-auto text-center">
            <!-- No phone available -->
            <div id="availableUnavailable" class="hidden">
                <p class="text-2xl text-red-700">No phone Available</p>
            </div>

            <!-- Phone Container -->

            <div id="phone-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 py-2 px-2">
                <!-- <div class="card bg-base-100 w-96 shadow-sm">
                    <figure>
                        <img
                        src="https://img.daisyui.com/images/stock/photo-1606107557195-0e29a4b5b4aa.webp"
                        alt="Shoes" />
                    </figure>
                    <div class="card-body">
                        <h2 class="card-title">Name</h2>
                        <p>A card component has a figure, a body part, and inside body there are title and actions parts</p>
                        <div class="card-actions justify-end">
                        <button class="btn btn-primary">Show Details</button>
                        </div>
                    </div>
                </div> -->
            </div>

            <!-- Show all -->

            <div id="show-all-container" class="hidden btn-primary ">
                <button onclick="handleShoeAll()" class=" text-gray-50 btn btn-xs sm:btn-sm md:btn-md lg:btn-lg xl:btn-xl">Show All</button>
            </div>
        </section>

        <!-- modal -->

        <section id="modalContainer">
           <div>
            <dialog id="my_modal_2" class="modal">
            <div class="modal-box">
                <h3 id="phoneName" class="text-lg font-bold"></h3>
                <div id="showDetailsContainer">

                </div>
                <p class="py-4">Press ESC key or click outside to close</p>
            </div>
            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
            </dialog>
           </div>
        </section>
        
    </main>
    <footer>
        
    </footer>
    <!-- Script --> 
    <script src="script/index.js"></script>
</body>
</html>
